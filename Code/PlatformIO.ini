; ESP32 Hub: LVGL UI + Spotify (OAuth PKCE) + Govee (Developer API) + Bluetooth A2DP source
; Target: ESP32-2432S028 "CYD" (original ESP32, ILI9341 + XPT2046). Needs CLASSIC Bluetooth,
; so S2/S3/C3/C6 boards will NOT work for the A2DP part.

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L

lib_deps =
  lvgl/lvgl@~8.3.11
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  https://github.com/pschatzmann/ESP32-A2DP.git
  bblanchon/ArduinoJson@^7.0.4

build_flags =
  ; ---- LVGL (no lv_conf.h needed) ----
  -D LV_CONF_SKIP=1
  -D LV_USE_QRCODE=1
  -D LV_MEM_CUSTOM=1
  -D LV_FONT_MONTSERRAT_20=1
  -D LV_USE_LOG=0
  ; ---- TFT_eSPI (CYD pinout) ----
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=55000000
  -D LOAD_GLCD=1